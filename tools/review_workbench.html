<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2027考研政治一页纸 - 知识库人工核验工作台 (里程碑1)</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --text: #1e293b;
      --text-muted: #64748b;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { background: #fff; border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 15px; }
    h1 { font-size: 16px; font-weight: 700; color: #0f172a; }
    .stat-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .stat-all { background: #f1f5f9; color: #475569; }
    .stat-needs { background: #fef3c7; color: #b45309; }
    .stat-verified { background: #dcfce7; color: #15803d; }
    .stat-error { background: #fee2e2; color: #b91c1c; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    button { cursor: pointer; border: none; outline: none; border-radius: 6px; padding: 6px 12px; font-size: 13px; font-weight: 500; transition: all 0.2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-outline { background: #fff; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: #f8fafc; }

    .main-container { flex: 1; display: grid; grid-template-columns: 320px 1fr 1fr; overflow: hidden; }

    /* 侧边列表 */
    .sidebar { background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .filter-box { padding: 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; background: #fafafa; }
    .search-input { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
    .filter-row { display: flex; gap: 6px; }
    select { flex: 1; padding: 5px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; }
    .card-list { flex: 1; overflow-y: auto; padding: 6px; }
    .list-item { padding: 9px 12px; border-radius: 6px; margin-bottom: 4px; cursor: pointer; border: 1px solid transparent; transition: all 0.15s; }
    .list-item:hover { background: #f1f5f9; }
    .list-item.active { background: var(--primary-light); border-color: #bfdbfe; }
    .item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .item-id { font-size: 12px; font-weight: 700; color: var(--primary); }
    .item-status { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
    .status-needs-review { background: #fef3c7; color: #b45309; }
    .status-verified { background: #dcfce7; color: #15803d; }
    .status-extraction-error { background: #fee2e2; color: #b91c1c; }
    .item-title { font-size: 13px; font-weight: 600; color: #334155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; display: flex; gap: 8px; }

    /* 中间：结构化数据 */
    .detail-view { background: #fff; border-right: 1px solid var(--border); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .section-box { border: 1px solid var(--border); border-radius: 8px; padding: 14px; background: #fafafa; }
    .section-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .detail-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .kp-main-title { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
    .kp-breadcrumbs { font-size: 13px; color: var(--text-muted); }
    .actions-bar { display: flex; gap: 8px; margin-top: 10px; }
    .btn-verify { background: #16a34a; color: white; }
    .btn-needs { background: #d97706; color: white; }
    .btn-err { background: #dc2626; color: white; }

    .content-box { font-size: 14px; line-height: 1.8; color: #1e293b; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 14px; white-space: pre-wrap; font-family: monospace; }
    .keyword { background: #fef08a; padding: 1px 3px; border-radius: 3px; }
    .distinction-item { padding: 6px 10px; border-radius: 4px; margin-bottom: 4px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .dist-correct { background: #f0fdf4; border-left: 3px solid #22c55e; }
    .dist-wrong { background: #fef2f2; border-left: 3px solid #ef4444; }
    .dist-warn { background: #fffbeb; border-left: 3px solid #f59e0b; }
    .mnemonic-item { background: #faf5ff; border-left: 3px solid #a855f7; padding: 6px 10px; border-radius: 4px; font-size: 13px; margin-bottom: 4px; }

    /* 右侧：PDF裁切原图 */
    .image-view { background: #334155; overflow: auto; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; position: relative; }
    .img-card-wrapper { background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); max-width: 95%; text-align: center; }
    .img-card-wrapper img { max-width: 100%; height: auto; border: 1px solid #e2e8f0; border-radius: 4px; display: block; margin: 0 auto; cursor: zoom-in; }
    .img-meta-tag { font-size: 12px; color: #fff; margin-bottom: 8px; background: rgba(0,0,0,0.4); padding: 4px 12px; border-radius: 12px; }

    /* 弹窗放大 */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
    .modal img { max-width: 90vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 0 25px rgba(0,0,0,0.5); }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>考研政治知识库人工核验工作台</h1>
      <span class="stat-pill stat-all" id="statTotal">总卡片: 0</span>
      <span class="stat-pill stat-needs" id="statNeeds">待核验: 0</span>
      <span class="stat-pill stat-verified" id="statVerified">已核验: 0</span>
      <span class="stat-pill stat-error" id="statError">错误: 0</span>
    </div>
    <div class="header-right">
      <input type="file" id="fileInput" accept=".json" style="display:none;" onchange="handleFileSelect(event)">
      <button class="btn-outline" onclick="document.getElementById('fileInput').click()">选择本地JSON</button>
      <button class="btn-primary" onclick="exportData()">导出已核验JSON</button>
    </div>
  </header>

  <div class="main-container">
    <!-- 侧边筛选与列表 -->
    <div class="sidebar">
      <div class="filter-box">
        <input type="text" id="searchInput" class="search-input" placeholder="按编号、标题或原文搜索..." oninput="filterCards()">
        <div class="filter-row">
          <select id="sectionFilter" onchange="filterCards()">
            <option value="">全部章节</option>
          </select>
          <select id="statusFilter" onchange="filterCards()">
            <option value="">全部状态</option>
            <option value="needs-review">待核验 (needs-review)</option>
            <option value="verified">已核验 (verified)</option>
            <option value="extraction-error">解析错误 (error)</option>
          </select>
        </div>
      </div>
      <div class="card-list" id="cardList"></div>
    </div>

    <!-- 中间：结构化解析结果 -->
    <div class="detail-view" id="detailView">
      <div style="color:var(--text-muted); text-align:center; margin-top:50px;">请选择左侧知识点卡片进行核对</div>
    </div>

    <!-- 右侧：PDF原图对照 -->
    <div class="image-view" id="imageView">
      <div class="img-meta-tag" id="imgMeta">PDF 原文裁切对照</div>
      <div class="img-card-wrapper" id="imgWrapper">
        <p style="color:#94a3b8; padding:30px;">未选择知识点</p>
      </div>
    </div>
  </div>

  <div class="modal" id="modal" onclick="closeModal()">
    <img id="modalImg" src="">
  </div>

  <script>
    let KB_DATA = null;
    let CURRENT_RECORD = null;
    let FILTERED_RECORDS = [];

    // 初始化自动加载
    window.addEventListener('DOMContentLoaded', () => {
      fetch('../data/knowledge.json')
        .then(res => res.json())
        .then(data => initData(data))
        .catch(err => {
          console.warn('Auto fetch failed, please select file manually:', err);
        });
    });

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const json = JSON.parse(evt.target.result);
          initData(json);
        } catch(err) {
          alert('解析 JSON 失败: ' + err.message);
        }
      };
      reader.readAsText(file, 'utf-8');
    }

    function initData(data) {
      KB_DATA = data;
      // 填充章节筛选
      const sections = new Set();
      KB_DATA.records.forEach(r => {
        if (r.section) sections.add(r.section);
      });
      const secSelect = document.getElementById('sectionFilter');
      secSelect.innerHTML = '<option value="">全部章节</option>';
      sections.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        secSelect.appendChild(opt);
      });

      updateStats();
      filterCards();
      if (KB_DATA.records.length > 0) {
        selectCard(KB_DATA.records[0]);
      }
    }

    function updateStats() {
      if (!KB_DATA) return;
      const total = KB_DATA.records.length;
      const needs = KB_DATA.records.filter(r => r.reviewStatus === 'needs-review').length;
      const verified = KB_DATA.records.filter(r => r.reviewStatus === 'verified').length;
      const error = KB_DATA.records.filter(r => r.reviewStatus === 'extraction-error').length;

      document.getElementById('statTotal').textContent = `总卡片: ${total}`;
      document.getElementById('statNeeds').textContent = `待核验: ${needs}`;
      document.getElementById('statVerified').textContent = `已核验: ${verified}`;
      document.getElementById('statError').textContent = `错误: ${error}`;
    }

    function filterCards() {
      if (!KB_DATA) return;
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const sec = document.getElementById('sectionFilter').value;
      const stat = document.getElementById('statusFilter').value;

      FILTERED_RECORDS = KB_DATA.records.filter(r => {
        if (q) {
          const inId = r.id.toLowerCase().includes(q) || r.sourceId.includes(q);
          const inTitle = r.title.toLowerCase().includes(q);
          const inContent = r.content.toLowerCase().includes(q);
          if (!inId && !inTitle && !inContent) return false;
        }
        if (sec && r.section !== sec) return false;
        if (stat && r.reviewStatus !== stat) return false;
        return true;
      });

      renderList();
    }

    function renderList() {
      const listEl = document.getElementById('cardList');
      listEl.innerHTML = '';
      FILTERED_RECORDS.forEach(r => {
        const item = document.createElement('div');
        item.className = 'list-item' + (CURRENT_RECORD && CURRENT_RECORD.id === r.id ? ' active' : '');
        item.onclick = () => selectCard(r);

        const statusClass = 'status-' + (r.reviewStatus || 'needs-review');
        item.innerHTML = `
          <div class="item-top">
            <span class="item-id">${r.id} (${r.sourceId})</span>
            <span class="item-status ${statusClass}">${r.reviewStatus}</span>
          </div>
          <div class="item-title">${r.title || '（未识别标题）'}</div>
          <div class="item-meta">
            <span>P${r.sourcePage[0]} (书码${r.bookPage[0]})</span>
            <span>关键词: ${r.keywords.length}</span>
            ${r.distinctions.length ? `<span>辨析: ${r.distinctions.length}</span>` : ''}
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    function selectCard(record) {
      CURRENT_RECORD = record;
      renderList();
      renderDetail(record);
      renderImage(record);
    }

    function renderDetail(r) {
      const el = document.getElementById('detailView');
      
      let distHtml = '';
      if (r.distinctions && r.distinctions.length) {
        distHtml = r.distinctions.map(d => {
          const c = d.verdict === 'correct' ? 'dist-correct' : (d.verdict === 'wrong' ? 'dist-wrong' : 'dist-warn');
          const sym = d.sourceSymbol || (d.verdict === 'correct' ? '✅' : '❌');
          return `<div class="distinction-item ${c}"><b>${sym} [${d.verdict || '辨析'}]</b> <span>${d.statement}</span></div>`;
        }).join('');
      } else {
        distHtml = '<div style="color:var(--text-muted); font-size:13px;">无辨析标记</div>';
      }

      let mneHtml = '';
      if (r.mnemonics && r.mnemonics.length) {
        mneHtml = r.mnemonics.map(m => `<div class="mnemonic-item">💡 ${m.text}</div>`).join('');
      } else {
        mneHtml = '<div style="color:var(--text-muted); font-size:13px;">无口诀标记</div>';
      }

      let notesHtml = (r.reviewNotes || []).map(n => `<span style="display:inline-block; background:#f1f5f9; padding:2px 8px; border-radius:4px; font-size:12px; margin-right:6px;">${n}</span>`).join('');

      el.innerHTML = `
        <div class="detail-header">
          <div>
            <div class="kp-breadcrumbs">${r.subject} &gt; ${r.chapter} &gt; <b>${r.section}</b> | PDF 第 ${r.sourcePage[0]} 页 (原书第 ${r.bookPage[0]} 页)</div>
            <h2 class="kp-main-title">[知识点 ${r.sourceId}] ${r.title}</h2>
            <div>${notesHtml}</div>
          </div>
        </div>

        <div class="actions-bar">
          <button class="btn-verify" onclick="setRecordStatus('verified')">标记为已核验 (Verified)</button>
          <button class="btn-needs" onclick="setRecordStatus('needs-review')">标记为待核验 (Needs Review)</button>
          <button class="btn-err" onclick="setRecordStatus('extraction-error')">标记为解析错误 (Error)</button>
        </div>

        <div class="section-box">
          <div class="section-title">
            <span>原文内容（含 {{关键词}} 标记与版面换行）</span>
            <span>字符数: ${r.content.length}</span>
          </div>
          <div class="content-box">${r.content}</div>
        </div>

        <div class="section-box">
          <div class="section-title">原书辨析与判断 (Distinctions)</div>
          ${distHtml}
        </div>

        <div class="section-box">
          <div class="section-title">原书助记与口诀 (Mnemonics)</div>
          ${mneHtml}
        </div>

        <div class="section-box">
          <div class="section-title">彩色关键词提取清单 (${r.keywords.length} 个)</div>
          <div style="display:flex; flex-wrap:wrap; gap:6px;">
            ${r.keywords.map(k => `<span style="color:${k.color}; border:1px solid ${k.color}; padding:2px 8px; border-radius:4px; font-size:12px; font-weight:bold; background:#fff;">${k.word}</span>`).join('')}
          </div>
        </div>
      `;
    }

    function renderImage(r) {
      const wrap = document.getElementById('imgWrapper');
      const meta = document.getElementById('imgMeta');
      if (!r.sourceImages || !r.sourceImages.length) {
        wrap.innerHTML = '<p style="color:#94a3b8; padding:30px;">无对应裁切图</p>';
        return;
      }
      const imgPath = '../public/' + r.sourceImages[0];
      meta.textContent = `PDF 原图裁切: ${r.sourceImages[0]} (坐标: ${r.sourceRegion.join(', ')})`;
      wrap.innerHTML = `<img src="${imgPath}" alt="${r.id}" onclick="openModal('${imgPath}')" title="点击放大查看原图">`;
    }

    function setRecordStatus(status) {
      if (!CURRENT_RECORD) return;
      CURRENT_RECORD.reviewStatus = status;
      updateStats();
      renderList();
      renderDetail(CURRENT_RECORD);
    }

    function exportData() {
      if (!KB_DATA) return;
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(KB_DATA, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", "knowledge_verified.json");
      dlAnchor.click();
    }

    function openModal(src) {
      document.getElementById('modalImg').src = src;
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
